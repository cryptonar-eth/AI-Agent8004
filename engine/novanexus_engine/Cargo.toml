[package]
name = "novanexus_engine"
version = "0.1.0"
edition = "2021"
description = "Security-first Rust risk engine for NovaNexus"

[lib]
name = "novanexus_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde"] }
